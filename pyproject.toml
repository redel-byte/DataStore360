[project]
name = "datastore360"
version = "0.1.0"
description = "Transformer les ventes brutes en données fiables et exploitables."
readme = "README.md"
authors = [
    { name = "El habib ridouane", email = "ridouanelhabib1@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.2.3",
    "setuptools<81",
    "sqlalchemy>=2.0,<3",
    "ydata-profiling>=4.18.4",
]

[project.scripts]
datastore360 = "datastore360:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
